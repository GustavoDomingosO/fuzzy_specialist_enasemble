# Example experiment config, mirroring interactive_make_classification_full.py's
# default slider values. Copy this file to define a new experiment -- the
# runner picks up every *.yaml/*.yml file under tests/ automatically.

name: binary_moderate
description: "Default-ish binary synthetic dataset, moderate difficulty."

dataset:
  n_samples: 1500
  n_features: 15
  n_informative: 5
  n_redundant: 0
  n_clusters_per_class: 2
  class_sep: 1.0
  flip_y: 0.01
  n_classes: 2
  weights: null
  random_state: 100

cv:
  n_splits: 5
  random_state: 100

# "all" (or omit this key) runs every model in MODEL_REGISTRY. Otherwise,
# list only the ones you want for this experiment, by name.
models: all

# Set to false to skip MLflow logging for this experiment (results.csv is
# always written either way).
mlflow: true
